name: Release

# Two channels from one pipeline:
#   • push a tag v*   → stable GitHub Release with DMG + EXE + checksums
#   • push to main    → refresh the rolling "latest-main" prerelease
# Installers are published only after both platform builds AND their smoke
# tests pass, so a red build can never replace a good release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sign_macos:
        description: Build a credentialed macOS signing rehearsal
        required: true
        type: boolean
        default: false
      notarize_macos:
        description: Submit, staple, and verify a signed macOS rehearsal
        required: true
        type: boolean
        default: false
      publish:
        description: Publish from main after exact-artifact acceptance
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve channel & version
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.vars.outputs.channel }}
      app_version: ${{ steps.vars.outputs.app_version }}
      asset_token: ${{ steps.vars.outputs.asset_token }}
      release_tag: ${{ steps.vars.outputs.release_tag }}
      macos_signing: ${{ steps.vars.outputs.macos_signing }}
      macos_signing_public: ${{ steps.vars.outputs.macos_signing_public }}
      macos_notarization: ${{ steps.vars.outputs.macos_notarization }}
      macos_notarization_public: ${{ steps.vars.outputs.macos_notarization_public }}
      publish: ${{ steps.vars.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve build variables
        id: vars
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
          MANUAL_SIGN_MACOS: ${{ inputs.sign_macos }}
          MANUAL_NOTARIZE_MACOS: ${{ inputs.notarize_macos }}
          MACOS_SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED }}
          MACOS_SIGNING_PUBLICLY_VERIFIED: ${{ vars.MACOS_SIGNING_PUBLICLY_VERIFIED }}
          MACOS_NOTARIZATION_ENABLED: ${{ vars.MACOS_NOTARIZATION_ENABLED }}
          MACOS_NOTARIZATION_PUBLICLY_VERIFIED: ${{ vars.MACOS_NOTARIZATION_PUBLICLY_VERIFIED }}
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/version.py)"
          if [[ -z "$APP_VERSION" ]]; then
            echo "Could not read __version__ from app/version.py" >&2
            exit 1
          fi
          {
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              TAG_VERSION="${GITHUB_REF_NAME#v}"
              if [[ "$TAG_VERSION" != "$APP_VERSION" ]]; then
                echo "Tag ${GITHUB_REF_NAME} does not match app/version.py (${APP_VERSION})." >&2
                echo "Bump app/version.py before tagging, or fix the tag." >&2
                exit 1
              fi
              echo "channel=stable"
              echo "app_version=$APP_VERSION"
              echo "asset_token=v$APP_VERSION"
              echo "release_tag=${GITHUB_REF_NAME}"
            else
              SHORT="$(git rev-parse --short HEAD)"
              echo "channel=dev"
              echo "app_version=$APP_VERSION"
              echo "asset_token=main-$SHORT"
              echo "release_tag=latest-main"
            fi
            if [[ "${MACOS_SIGNING_ENABLED:-}" == "true" || ( "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_SIGN_MACOS" == "true" ) ]]; then
              echo "macos_signing=true"
              SIGN_MACOS=true
            else
              echo "macos_signing=false"
              SIGN_MACOS=false
            fi
            if [[ "${MACOS_SIGNING_ENABLED:-}" == "true" && "${MACOS_SIGNING_PUBLICLY_VERIFIED:-}" == "true" ]]; then
              echo "macos_signing_public=true"
            else
              echo "macos_signing_public=false"
            fi
            if [[ "${MACOS_NOTARIZATION_ENABLED:-}" == "true" || ( "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_NOTARIZE_MACOS" == "true" ) ]]; then
              if [[ "$SIGN_MACOS" != "true" ]]; then
                echo "macOS notarization requires Developer ID signing in the same run." >&2
                exit 1
              fi
              echo "macos_notarization=true"
            else
              echo "macos_notarization=false"
            fi
            if [[ "${MACOS_NOTARIZATION_ENABLED:-}" == "true" && "${MACOS_NOTARIZATION_PUBLICLY_VERIFIED:-}" == "true" && "${MACOS_SIGNING_PUBLICLY_VERIFIED:-}" == "true" ]]; then
              echo "macos_notarization_public=true"
            else
              echo "macos_notarization_public=false"
            fi
            if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
              echo "publish=true"
            elif [[ "$MANUAL_PUBLISH" == "true" ]]; then
              if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
                echo "Manual publication is restricted to refs/heads/main." >&2
                exit 1
              fi
              echo "publish=true"
            else
              echo "publish=false"
            fi
          } >> "$GITHUB_OUTPUT"

  test:
    name: Test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Prepare isolated FolioOrb profile
        run: |
          PROFILE_ROOT="$(mktemp -d "${RUNNER_TEMP}/folioorb-release.XXXXXX")"
          echo "FOLIOORB_DATA_DIR=$PROFILE_ROOT" >> "$GITHUB_ENV"
          echo "DATABASE_URL=sqlite:///$PROFILE_ROOT/database/portfolio.db" >> "$GITHUB_ENV"
      - name: Run tests
        env:
          ANTHROPIC_API_KEY: ""
        run: python -m pytest -q

  build-macos:
    name: Build macOS DMG (arm64)
    needs: [prepare, test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-desktop.txt
      - name: Prepare Developer ID keychain
        if: needs.prepare.outputs.macos_signing == 'true'
        env:
          MACOS_DEVELOPER_ID_CERTIFICATE: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE }}
          MACOS_DEVELOPER_ID_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_PASSWORD }}
          EXPECTED_TEAM_ID: ${{ vars.MACOS_DEVELOPER_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_DEVELOPER_ID_CERTIFICATE:-}" || -z "${MACOS_DEVELOPER_ID_PASSWORD:-}" ]]; then
            echo "MACOS_SIGNING_ENABLED=true requires both Developer ID secrets." >&2
            exit 1
          fi
          if [[ ! "${EXPECTED_TEAM_ID:-}" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "MACOS_DEVELOPER_TEAM_ID must be the expected 10-character Apple Team ID." >&2
            exit 1
          fi

          umask 077
          KEYCHAIN_PATH="${RUNNER_TEMP}/folioorb-developer-id.keychain-db"
          CERTIFICATE_PATH="${RUNNER_TEMP}/folioorb-developer-id.p12"
          export CERTIFICATE_PATH
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::${KEYCHAIN_PASSWORD}"
          SIGNING_KEYCHAIN_READY=false
          cleanup_signing_setup() {
            rm -f "$CERTIFICATE_PATH"
            if [[ "$SIGNING_KEYCHAIN_READY" != "true" && -f "$KEYCHAIN_PATH" ]]; then
              security delete-keychain "$KEYCHAIN_PATH" || true
            fi
          }
          trap cleanup_signing_setup EXIT

          python - <<'PY'
          import base64
          import binascii
          import os
          from pathlib import Path

          try:
              certificate = base64.b64decode(
                  os.environ["MACOS_DEVELOPER_ID_CERTIFICATE"], validate=True
              )
          except (KeyError, ValueError, binascii.Error) as exc:
              raise SystemExit("MACOS_DEVELOPER_ID_CERTIFICATE is not valid base64") from exc
          if not certificate:
              raise SystemExit("MACOS_DEVELOPER_ID_CERTIFICATE decoded to an empty file")
          Path(os.environ["CERTIFICATE_PATH"]).write_bytes(certificate)
          PY

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_DEVELOPER_ID_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          IDENTITIES="$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | awk -F'"' -v suffix="(${EXPECTED_TEAM_ID})" \
                  '/Developer ID Application:/ && index($2, suffix) == length($2) - length(suffix) + 1 {print $2}'
          )"
          IDENTITY_COUNT="$(printf '%s\n' "$IDENTITIES" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [[ "$IDENTITY_COUNT" != "1" ]]; then
            echo "Expected exactly one valid Developer ID Application identity for team ${EXPECTED_TEAM_ID}; found ${IDENTITY_COUNT}." >&2
            exit 1
          fi
          IDENTITY="$(printf '%s\n' "$IDENTITIES" | sed -n '1p')"
          {
            echo "FOLIOORB_CODESIGN_IDENTITY=$IDENTITY"
            echo "FOLIOORB_SIGNING_KEYCHAIN=$KEYCHAIN_PATH"
          } >> "$GITHUB_ENV"
          SIGNING_KEYCHAIN_READY=true
      - name: Build app bundle
        run: python -m PyInstaller --noconfirm packaging/pyinstaller/FolioOrb.spec
      - name: Repair macOS bundle data symlinks
        # PyInstaller's macOS BUNDLE step can leave dangling Frameworks -> Resources
        # symlinks for pure-data package trees (observed with static/, templates/,
        # and pytz's zoneinfo data). See the script for the full explanation.
        run: python packaging/pyinstaller/fix_macos_bundle_symlinks.py dist
      - name: Seal and verify Developer ID app bundle
        if: needs.prepare.outputs.macos_signing == 'true'
        run: |
          set -euo pipefail
          codesign \
            --force \
            --all-architectures \
            --timestamp \
            --options runtime \
            --entitlements packaging/macos/FolioOrb.entitlements \
            --sign "$FOLIOORB_CODESIGN_IDENTITY" \
            dist/FolioOrb.app
          codesign --verify --deep --strict --verbose=2 dist/FolioOrb.app
          codesign --display --verbose=4 dist/FolioOrb.app 2>&1 \
            | grep -F "Authority=Developer ID Application:"
          ACTUAL_TEAM_ID="$(
            codesign --display --verbose=4 dist/FolioOrb.app 2>&1 \
              | sed -n 's/^TeamIdentifier=//p'
          )"
          if [[ "$ACTUAL_TEAM_ID" != "${{ vars.MACOS_DEVELOPER_TEAM_ID }}" ]]; then
            echo "Signed app team ${ACTUAL_TEAM_ID:-missing} does not match the expected Team ID." >&2
            exit 1
          fi
      - name: Smoke test the frozen bundle
        run: |
          dist/FolioOrb.app/Contents/MacOS/FolioOrb --smoke
          dist/FolioOrb.app/Contents/MacOS/FolioOrb --smoke-duplicate-recovery
      - name: Notarize and staple app bundle
        if: needs.prepare.outputs.macos_notarization == 'true'
        env:
          MACOS_NOTARY_PRIVATE_KEY: ${{ secrets.MACOS_NOTARY_PRIVATE_KEY }}
          FOLIOORB_NOTARY_KEY_ID: ${{ vars.MACOS_NOTARY_KEY_ID }}
          FOLIOORB_NOTARY_ISSUER_ID: ${{ vars.MACOS_NOTARY_ISSUER_ID }}
        run: packaging/macos/with_notary_key.sh app dist/FolioOrb.app
      - name: Build DMG
        env:
          ASSET_TOKEN: ${{ needs.prepare.outputs.asset_token }}
        run: |
          set -euo pipefail
          brew install create-dmg
          mkdir -p dist/dmg-src dist/out
          cp -R dist/FolioOrb.app dist/dmg-src/
          # Back-compat for pre-rename (<= v4.x) macOS auto-updaters: their baked
          # swap script mounts this DMG and looks for a bundle named literally
          # "FolioSenseAI.app". A relative symlink to the real app lets those old
          # installs complete the update to FolioOrb — the swap's `ditto`
          # dereferences the symlink into a real copy and its `[ -d ]` follows it
          # (both verified). It's parked off-window below so new users only ever
          # see FolioOrb.app; the current FolioOrb updater globs *.app and picks
          # FolioOrb.app (sorts first), so it's unaffected.
          ln -s FolioOrb.app dist/dmg-src/FolioSenseAI.app
          DMG="dist/out/FolioOrb-macOS-arm64-${ASSET_TOKEN}.dmg"
          create-dmg \
            --volname "FolioOrb" \
            --volicon packaging/icons/FolioOrb.icns \
            --window-size 540 380 \
            --icon-size 110 \
            --icon "FolioOrb.app" 150 190 \
            --app-drop-link 390 190 \
            --hide-extension "FolioOrb.app" \
            --icon "FolioSenseAI.app" 620 999 \
            "$DMG" "dist/dmg-src/" || true
          if [[ ! -f "$DMG" ]]; then
            echo "DMG was not produced" >&2
            exit 1
          fi
          echo "Built $DMG"
      - name: Sign and verify Developer ID DMG
        if: needs.prepare.outputs.macos_signing == 'true'
        run: |
          set -euo pipefail
          DMG="$(find dist/out -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [[ -z "$DMG" ]]; then
            echo "No DMG exists to sign." >&2
            exit 1
          fi
          codesign \
            --force \
            --timestamp \
            --sign "$FOLIOORB_CODESIGN_IDENTITY" \
            "$DMG"
          codesign --verify --strict --verbose=2 "$DMG"
          codesign --display --verbose=4 "$DMG" 2>&1 \
            | grep -F "Authority=Developer ID Application:"
          ACTUAL_TEAM_ID="$(
            codesign --display --verbose=4 "$DMG" 2>&1 \
              | sed -n 's/^TeamIdentifier=//p'
          )"
          if [[ "$ACTUAL_TEAM_ID" != "${{ vars.MACOS_DEVELOPER_TEAM_ID }}" ]]; then
            echo "Signed DMG team ${ACTUAL_TEAM_ID:-missing} does not match the expected Team ID." >&2
            exit 1
          fi

          hdiutil verify "$DMG"
          MOUNT_ROOT="$(mktemp -d "${RUNNER_TEMP}/folioorb-dmg-check.XXXXXX")"
          MOUNT_POINT="${MOUNT_ROOT}/mounted"
          mkdir "$MOUNT_POINT"
          DMG_MOUNTED=false
          cleanup_dmg_check() {
            if [[ "$DMG_MOUNTED" == "true" ]]; then
              hdiutil detach "$MOUNT_POINT" -quiet || true
            fi
            rmdir "$MOUNT_POINT" "$MOUNT_ROOT" 2>/dev/null || true
          }
          trap cleanup_dmg_check EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT_POINT" "$DMG" >/dev/null
          DMG_MOUNTED=true
          codesign --verify --deep --strict --verbose=2 "$MOUNT_POINT/FolioOrb.app"
          EMBEDDED_TEAM_ID="$(
            codesign --display --verbose=4 "$MOUNT_POINT/FolioOrb.app" 2>&1 \
              | sed -n 's/^TeamIdentifier=//p'
          )"
          if [[ "$EMBEDDED_TEAM_ID" != "${{ vars.MACOS_DEVELOPER_TEAM_ID }}" ]]; then
            echo "DMG app team ${EMBEDDED_TEAM_ID:-missing} does not match the expected Team ID." >&2
            exit 1
          fi
          hdiutil detach "$MOUNT_POINT" -quiet
          DMG_MOUNTED=false
          rmdir "$MOUNT_POINT" "$MOUNT_ROOT"
          trap - EXIT
      - name: Notarize and staple DMG
        if: needs.prepare.outputs.macos_notarization == 'true'
        env:
          MACOS_NOTARY_PRIVATE_KEY: ${{ secrets.MACOS_NOTARY_PRIVATE_KEY }}
          FOLIOORB_NOTARY_KEY_ID: ${{ vars.MACOS_NOTARY_KEY_ID }}
          FOLIOORB_NOTARY_ISSUER_ID: ${{ vars.MACOS_NOTARY_ISSUER_ID }}
          ASSET_TOKEN: ${{ needs.prepare.outputs.asset_token }}
        run: >-
          packaging/macos/with_notary_key.sh dmg
          "dist/out/FolioOrb-macOS-arm64-${ASSET_TOKEN}.dmg"
      - name: Verify notarized DMG and embedded app
        if: needs.prepare.outputs.macos_notarization == 'true'
        env:
          ASSET_TOKEN: ${{ needs.prepare.outputs.asset_token }}
        run: |
          set -euo pipefail
          DMG="dist/out/FolioOrb-macOS-arm64-${ASSET_TOKEN}.dmg"
          if [[ ! -f "$DMG" ]]; then
            echo "The notarized DMG is missing." >&2
            exit 1
          fi
          hdiutil verify "$DMG"

          MOUNT_ROOT="$(mktemp -d "${RUNNER_TEMP}/folioorb-notary-check.XXXXXX")"
          MOUNT_POINT="${MOUNT_ROOT}/mounted"
          mkdir "$MOUNT_POINT"
          DMG_MOUNTED=false
          cleanup_notary_check() {
            if [[ "$DMG_MOUNTED" == "true" ]]; then
              hdiutil detach "$MOUNT_POINT" -quiet || true
            fi
            rmdir "$MOUNT_POINT" "$MOUNT_ROOT" 2>/dev/null || true
          }
          trap cleanup_notary_check EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT_POINT" "$DMG" >/dev/null
          DMG_MOUNTED=true
          xcrun stapler validate "$MOUNT_POINT/FolioOrb.app"
          APP_ASSESSMENT="$(spctl --assess --type execute --verbose=4 "$MOUNT_POINT/FolioOrb.app" 2>&1)"
          printf '%s\n' "$APP_ASSESSMENT"
          grep -F "source=Notarized Developer ID" <<< "$APP_ASSESSMENT"
          hdiutil detach "$MOUNT_POINT" -quiet
          DMG_MOUNTED=false
          rmdir "$MOUNT_POINT" "$MOUNT_ROOT"
          trap - EXIT
      - name: Record macOS artifact checksum
        run: |
          set -euo pipefail
          cd dist/out
          DMGS=(FolioOrb-macOS-arm64-*.dmg)
          if [[ "${#DMGS[@]}" != "1" || ! -f "${DMGS[0]}" ]]; then
            echo "Expected exactly one macOS DMG before upload." >&2
            exit 1
          fi
          shasum -a 256 -- "${DMGS[0]}" > macos-SHA256SUMS.txt
          shasum -a 256 --check macos-SHA256SUMS.txt
      - name: Cleanup Developer ID keychain
        if: ${{ always() && needs.prepare.outputs.macos_signing == 'true' }}
        run: |
          if [[ -n "${FOLIOORB_SIGNING_KEYCHAIN:-}" && -f "$FOLIOORB_SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$FOLIOORB_SIGNING_KEYCHAIN"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: |
            dist/out/*.dmg
            dist/out/macos-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows installer (x64)
    needs: [prepare, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-desktop.txt pytest
      - name: Exercise Windows backup safety
        run: >-
          python -m pytest -q
          tests/test_backup_policy.py
          tests/test_backup_service.py
          tests/test_source_installer_profile.py
      - name: Exercise Windows source installer and parser gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($script in @("scripts/install-win.ps1", "scripts/setup.ps1", "scripts/start.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count) { throw "$script failed PowerShell parsing: $errors" }
          }

          $sandbox = Join-Path $env:RUNNER_TEMP "folioorb-source-installer"
          $env:FOLIOORB_INSTALL_DIR = Join-Path $sandbox "install"
          $env:FOLIOORB_DATA_DIR = Join-Path $sandbox "profile with spaces"
          $env:FOLIOORB_SHORTCUT = Join-Path $sandbox "Desktop\FolioOrb.lnk"
          $env:FOLIOORB_INSTALL_NO_START = "1"
          $env:FOLIO_REF = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "main" }

          New-Item -ItemType Directory -Force -Path "$env:FOLIOORB_INSTALL_DIR\database" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:FOLIOORB_INSTALL_DIR\backups" | Out-Null
          @'
          import os
          import sqlite3
          from pathlib import Path

          install = Path(os.environ["FOLIOORB_INSTALL_DIR"])
          with sqlite3.connect(install / "database" / "portfolio.db") as connection:
              connection.execute("CREATE TABLE proof (value TEXT NOT NULL)")
              connection.execute("INSERT INTO proof VALUES ('preserved')")
              connection.commit()
          '@ | python -
          Set-Content "$env:FOLIOORB_INSTALL_DIR\.env" "DATABASE_URL=sqlite:///./database/portfolio.db"
          Set-Content "$env:FOLIOORB_INSTALL_DIR\settings.json" '{"notify_updates":false}'
          Set-Content "$env:FOLIOORB_INSTALL_DIR\backups\manual.db" "backup-fixture"

          & .\scripts\install-win.ps1
          if ($LASTEXITCODE -ne 0) { throw "First source install failed." }
          if (-not (Test-Path "$env:FOLIOORB_DATA_DIR\settings.json")) { throw "Settings were not migrated." }
          if (-not (Test-Path "$env:FOLIOORB_DATA_DIR\backups\manual.db")) { throw "Backup Vault was not migrated." }
          if (-not (Test-Path $env:FOLIOORB_SHORTCUT)) { throw "Source shortcut was not created." }
          $pointer = (Get-Content "$env:FOLIOORB_INSTALL_DIR\.source-profile-path" -Raw).Trim()
          if ($pointer -ne $env:FOLIOORB_DATA_DIR) { throw "Persisted profile path is not exact and absolute." }
          @'
          import os
          import sqlite3
          from pathlib import Path

          database = Path(os.environ["FOLIOORB_DATA_DIR"]) / "database" / "portfolio.db"
          with sqlite3.connect(database) as connection:
              assert connection.execute("SELECT value FROM proof").fetchone() == ("preserved",)
          '@ | python -

          $parent = Split-Path $env:FOLIOORB_INSTALL_DIR
          $leaf = Split-Path $env:FOLIOORB_INSTALL_DIR -Leaf
          $recoveries = @(Get-ChildItem $parent -Directory -Filter "$leaf-profile-recovery-*")
          if ($recoveries.Count -ne 1) { throw "Expected exactly one first-migration recovery copy." }

          & .\scripts\install-win.ps1
          if ($LASTEXITCODE -ne 0) { throw "Routine source update failed." }
          $after = @(Get-ChildItem $parent -Directory -Filter "$leaf-profile-recovery-*")
          if ($after.Count -ne 1) { throw "Routine update created or removed a recovery copy." }
          @'
          import os
          import sqlite3
          from pathlib import Path

          database = Path(os.environ["FOLIOORB_DATA_DIR"]) / "database" / "portfolio.db"
          with sqlite3.connect(database) as connection:
              assert connection.execute("SELECT value FROM proof").fetchone() == ("preserved",)
          '@ | python -
      - name: Build app bundle
        run: python -m PyInstaller --noconfirm packaging/pyinstaller/FolioOrb.spec
      - name: Smoke test the frozen bundle
        shell: pwsh
        run: |
          # Start-Process alone doesn't pipe the child's stdout/stderr back to
          # this shell, so failures show up as a bare exit code with no
          # message. Redirect to files and print them so a failure is
          # actually diagnosable from the workflow log.
          foreach ($argument in @("--smoke", "--smoke-duplicate-recovery")) {
            $stem = $argument.TrimStart("-")
            $outFile = "$stem-stdout.log"
            $errFile = "$stem-stderr.log"
            $proc = Start-Process -FilePath "dist\FolioOrb\FolioOrb.exe" `
              -ArgumentList $argument -RedirectStandardOutput $outFile `
              -RedirectStandardError $errFile -Wait -PassThru
            Write-Host "--- $argument stdout ---"
            if (Test-Path $outFile) { Get-Content $outFile }
            Write-Host "--- $argument stderr ---"
            if (Test-Path $errFile) { Get-Content $errFile }
            if ($proc.ExitCode -ne 0) {
              Write-Error "$argument failed with exit code $($proc.ExitCode)"
              exit 1
            }
          }
      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          ASSET_TOKEN: ${{ needs.prepare.outputs.asset_token }}
        run: |
          choco install innosetup -y --no-progress
          $outputName = "FolioOrb-Windows-x64-$env:ASSET_TOKEN-Setup"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$env:APP_VERSION" "/DMyOutputName=$outputName" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/installer/*.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [prepare, build-macos, build-windows]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Hoisted to job env because the `secrets` context is NOT allowed in a
      # step `if:` (using it there makes the whole workflow invalid). `env` IS
      # allowed in a step `if:`, so the signing step gates on this instead.
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
      MACOS_SIGNING_ACTIVE: ${{ needs.prepare.outputs.macos_signing }}
      MACOS_SIGNED: ${{ needs.prepare.outputs.macos_signing_public }}
      MACOS_NOTARIZATION_ACTIVE: ${{ needs.prepare.outputs.macos_notarization }}
      MACOS_NOTARIZED: ${{ needs.prepare.outputs.macos_notarization_public }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble assets and checksums
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' \) -exec cp {} release/ \;
          cd release
          shasum -a 256 -- * > SHA256SUMS.txt
          echo "Assets:"; ls -la

      - name: Sign checksums (minisign)
        # Authenticity signature for SHA256SUMS.txt. Runs only once the signing
        # key secret is configured; until then releases ship SHA-256 checksums
        # only and the app verifies integrity without authenticity. The app
        # embeds the matching public key (app/services/signature_service.py).
        if: ${{ env.MINISIGN_SECRET_KEY != '' }}
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y minisign
          printf '%s\n' "$MINISIGN_SECRET_KEY" > minisign.key
          # Key is created passwordless (minisign -G -W) so CI can sign headless.
          minisign -S -s minisign.key -m release/SHA256SUMS.txt
          rm -f minisign.key
          echo "Signed: $(ls release/SHA256SUMS.txt.minisig)"
      - name: Publish stable release
        if: needs.prepare.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "FolioOrb $TAG" \
              --generate-notes \
              --verify-tag
          fi
      - name: Refresh latest-main prerelease
        if: needs.prepare.outputs.channel == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
          TOKEN: ${{ needs.prepare.outputs.asset_token }}
        run: |
          set -euo pipefail
          BUILT="$(date -u '+%Y-%m-%d %H:%M UTC')"
          if [[ "$MACOS_NOTARIZED" == "true" ]]; then
            SECURITY_NOTE="The macOS app and DMG are Developer ID signed and notarized; Windows remains unsigned."
          elif [[ "$MACOS_NOTARIZATION_ACTIVE" == "true" ]]; then
            SECURITY_NOTE="macOS signing and notarization are in credentialed pilot validation and are not yet accepted public guarantees; Windows remains unsigned."
          elif [[ "$MACOS_SIGNED" == "true" ]]; then
            SECURITY_NOTE="The macOS app and DMG are Developer ID signed but not yet notarized; Windows remains unsigned."
          elif [[ "$MACOS_SIGNING_ACTIVE" == "true" ]]; then
            SECURITY_NOTE="macOS signing is in credentialed pilot validation and is not yet an accepted public guarantee; Windows remains unsigned."
          else
            SECURITY_NOTE="Builds are not yet code-signed."
          fi
          NOTES=$(cat <<EOF
          **Rolling development build from \`main\`.**

          - Commit: \`${GITHUB_SHA}\`
          - Build: \`${TOKEN}\`
          - Built: ${BUILT}

          > ⚠️ These builds come straight from the latest \`main\` merge and may be
          > unstable. For everyday use, grab the [latest stable release](https://github.com/${GITHUB_REPOSITORY}/releases/latest).
          >
          > ${SECURITY_NOTE} See the install docs for the expected platform warnings
          > and how to verify your download with SHA256SUMS.txt.
          EOF
          )
          (cd release && shasum -a 256 --check SHA256SUMS.txt)

          # Refresh in place so a failed update cannot delete the last good
          # development build. Asset names include the commit, so upload the
          # new set first, move the rolling tag, then prune stale assets.
          if gh release view latest-main --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest-main release/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest-main" \
              --raw-field sha="$GITHUB_SHA" \
              -F force=true \
              --silent
            gh release edit latest-main \
              --repo "$GITHUB_REPOSITORY" \
              --title "Latest main build" \
              --notes "$NOTES" \
              --prerelease \
              --target "$GITHUB_SHA"

            while IFS=$'\t' read -r asset_api asset_name; do
              if [[ ! -f "release/${asset_name}" ]]; then
                gh api --method DELETE \
                  "${asset_api#https://api.github.com/}" \
                  --silent
              fi
            done < <(
              gh release view latest-main \
                --repo "$GITHUB_REPOSITORY" \
                --json assets \
                --jq '.assets[] | [.apiUrl, .name] | @tsv'
            )
          else
            gh release create latest-main release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Latest main build" \
              --notes "$NOTES" \
              --prerelease \
              --target "$GITHUB_SHA"
          fi

          # Verify the remote release before declaring the rolling channel
          # refreshed. This catches tag drift and stale/missing assets.
          ACTUAL_SHA="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/latest-main" \
              --jq '.object.sha'
          )"
          if [[ "$ACTUAL_SHA" != "$GITHUB_SHA" ]]; then
            echo "latest-main points to ${ACTUAL_SHA}, expected ${GITHUB_SHA}" >&2
            exit 1
          fi

          diff -u \
            <(find release -maxdepth 1 -type f -printf '%f\n' | sort) \
            <(
              gh release view latest-main \
                --repo "$GITHUB_REPOSITORY" \
                --json assets \
                --jq '.assets[].name' | sort
            )
