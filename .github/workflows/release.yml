name: Release

# Two channels from one pipeline:
#   • push a tag v*   → stable GitHub Release with DMG + EXE + checksums
#   • push to main    → refresh the rolling "latest-main" prerelease
# Installers are published only after both platform builds AND their smoke
# tests pass, so a red build can never replace a good release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sign_macos:
        description: Build a credentialed macOS signing rehearsal
        required: true
        type: boolean
        default: false
      notarize_macos:
        description: Submit, staple, and verify a signed macOS rehearsal
        required: true
        type: boolean
        default: false
      sign_windows:
        description: Build an Azure Artifact Signing rehearsal for Windows
        required: true
        type: boolean
        default: false
      publish:
        description: Publish from main after exact-artifact acceptance
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve channel & version
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.vars.outputs.channel }}
      app_version: ${{ steps.vars.outputs.app_version }}
      asset_token: ${{ steps.vars.outputs.asset_token }}
      release_tag: ${{ steps.vars.outputs.release_tag }}
      source_sha: ${{ steps.vars.outputs.source_sha }}
      macos_signing: ${{ steps.vars.outputs.macos_signing }}
      macos_signing_public: ${{ steps.vars.outputs.macos_signing_public }}
      macos_notarization: ${{ steps.vars.outputs.macos_notarization }}
      macos_notarization_public: ${{ steps.vars.outputs.macos_notarization_public }}
      windows_signing: ${{ steps.vars.outputs.windows_signing }}
      windows_signing_public: ${{ steps.vars.outputs.windows_signing_public }}
      publish: ${{ steps.vars.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve build variables
        id: vars
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
          MANUAL_SIGN_MACOS: ${{ inputs.sign_macos }}
          MANUAL_NOTARIZE_MACOS: ${{ inputs.notarize_macos }}
          MANUAL_SIGN_WINDOWS: ${{ inputs.sign_windows }}
          MACOS_SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED }}
          MACOS_SIGNING_PUBLICLY_VERIFIED: ${{ vars.MACOS_SIGNING_PUBLICLY_VERIFIED }}
          MACOS_NOTARIZATION_ENABLED: ${{ vars.MACOS_NOTARIZATION_ENABLED }}
          MACOS_NOTARIZATION_PUBLICLY_VERIFIED: ${{ vars.MACOS_NOTARIZATION_PUBLICLY_VERIFIED }}
          WINDOWS_SIGNING_ENABLED: ${{ vars.WINDOWS_SIGNING_ENABLED }}
          WINDOWS_SIGNING_PUBLICLY_VERIFIED: ${{ vars.WINDOWS_SIGNING_PUBLICLY_VERIFIED }}
          MACOS_SIGNING_TRUST_BOUNDARY_ACCEPTED: ${{ vars.MACOS_SIGNING_TRUST_BOUNDARY_ACCEPTED }}
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/version.py)"
          if [[ -z "$APP_VERSION" ]]; then
            echo "Could not read __version__ from app/version.py" >&2
            exit 1
          fi
          {
            SOURCE_SHA="$(git rev-parse HEAD)"
            if [[ "$SOURCE_SHA" != "$GITHUB_SHA" ]]; then
              echo "Checked-out source SHA does not match the workflow source SHA." >&2
              exit 1
            fi
            echo "source_sha=$SOURCE_SHA"
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              TAG_VERSION="${GITHUB_REF_NAME#v}"
              if [[ "$TAG_VERSION" != "$APP_VERSION" ]]; then
                echo "Tag ${GITHUB_REF_NAME} does not match app/version.py (${APP_VERSION})." >&2
                echo "Bump app/version.py before tagging, or fix the tag." >&2
                exit 1
              fi
              echo "channel=stable"
              echo "app_version=$APP_VERSION"
              echo "asset_token=v$APP_VERSION"
              echo "release_tag=${GITHUB_REF_NAME}"
            else
              SHORT="$(git rev-parse --short HEAD)"
              echo "channel=dev"
              echo "app_version=$APP_VERSION"
              echo "asset_token=main-$SHORT"
              echo "release_tag=latest-main"
            fi
            if [[ "${MACOS_SIGNING_ENABLED:-}" == "true" || ( "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_SIGN_MACOS" == "true" ) ]]; then
              if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
                echo "macOS credentialed release work is restricted to protected refs/heads/main." >&2
                exit 1
              fi
              if [[ "${MACOS_SIGNING_TRUST_BOUNDARY_ACCEPTED:-}" != "true" ]]; then
                echo "macOS signing remains disabled until its external protected-environment and fixed-logic boundary is accepted." >&2
                exit 1
              fi
              echo "macos_signing=true"
              SIGN_MACOS=true
            else
              echo "macos_signing=false"
              SIGN_MACOS=false
            fi
            if [[ "${MACOS_SIGNING_ENABLED:-}" == "true" && "${MACOS_SIGNING_PUBLICLY_VERIFIED:-}" == "true" ]]; then
              echo "macos_signing_public=true"
            else
              echo "macos_signing_public=false"
            fi
            if [[ "${MACOS_NOTARIZATION_ENABLED:-}" == "true" || ( "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_NOTARIZE_MACOS" == "true" ) ]]; then
              if [[ "$SIGN_MACOS" != "true" ]]; then
                echo "macOS notarization requires Developer ID signing in the same run." >&2
                exit 1
              fi
              echo "macos_notarization=true"
            else
              echo "macos_notarization=false"
            fi
            if [[ "${MACOS_NOTARIZATION_ENABLED:-}" == "true" && "${MACOS_NOTARIZATION_PUBLICLY_VERIFIED:-}" == "true" && "${MACOS_SIGNING_PUBLICLY_VERIFIED:-}" == "true" ]]; then
              echo "macos_notarization_public=true"
            else
              echo "macos_notarization_public=false"
            fi
            if [[ "${WINDOWS_SIGNING_ENABLED:-}" == "true" || ( "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_SIGN_WINDOWS" == "true" ) ]]; then
              if [[ "$EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" && "$GITHUB_REF" != refs/tags/v* ]]; then
                echo "Manual Windows signing is restricted to refs/heads/main or version tags." >&2
                exit 1
              fi
              echo "windows_signing=true"
            else
              echo "windows_signing=false"
            fi
            if [[ "${WINDOWS_SIGNING_ENABLED:-}" == "true" && "${WINDOWS_SIGNING_PUBLICLY_VERIFIED:-}" == "true" ]]; then
              echo "windows_signing_public=true"
            else
              echo "windows_signing_public=false"
            fi
            if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
              echo "publish=true"
            elif [[ "$MANUAL_PUBLISH" == "true" ]]; then
              if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
                echo "Manual publication is restricted to refs/heads/main." >&2
                exit 1
              fi
              echo "publish=true"
            else
              echo "publish=false"
            fi
          } >> "$GITHUB_OUTPUT"

  test:
    name: Test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
          cache: pip
      - name: Install hash-locked test dependencies
        run: python -m pip install --require-hashes -r requirements-release-test-linux.lock
      - name: Prepare isolated FolioOrb profile
        run: |
          PROFILE_ROOT="$(mktemp -d "${RUNNER_TEMP}/folioorb-release.XXXXXX")"
          echo "FOLIOORB_DATA_DIR=$PROFILE_ROOT" >> "$GITHUB_ENV"
          echo "DATABASE_URL=sqlite:///$PROFILE_ROOT/database/portfolio.db" >> "$GITHUB_ENV"
      - name: Run tests
        env:
          ANTHROPIC_API_KEY: ""
        run: python -m pytest -q

  build-macos:
    name: Build macOS app (arm64)
    needs: [prepare, test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
          cache: pip
      - name: Install locked desktop dependencies
        run: python -m pip install --require-hashes -r requirements-desktop-macos.lock
      - name: Build app bundle
        run: python -m PyInstaller --noconfirm packaging/pyinstaller/FolioOrb.spec
      - name: Repair macOS bundle data symlinks
        run: python packaging/pyinstaller/fix_macos_bundle_symlinks.py dist
      - name: Smoke test the frozen bundle
        run: |
          dist/FolioOrb.app/Contents/MacOS/FolioOrb --smoke
          dist/FolioOrb.app/Contents/MacOS/FolioOrb --smoke-duplicate-recovery
      - name: Install pinned create-dmg
        if: needs.prepare.outputs.macos_signing != 'true'
        run: |
          packaging/macos/install_create_dmg.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build and structurally verify unsigned DMG
        if: needs.prepare.outputs.macos_signing != 'true'
        env:
          ASSET_TOKEN: ${{ needs.prepare.outputs.asset_token }}
        run: >-
          packaging/macos/build_and_verify_dmg.sh
          dist/FolioOrb.app
          "dist/out/FolioOrb-macOS-arm64-${ASSET_TOKEN}.dmg"
      - name: Record unsigned macOS artifact checksum
        if: needs.prepare.outputs.macos_signing != 'true'
        run: |
          set -euo pipefail
          cd dist/out
          DMGS=(FolioOrb-macOS-arm64-*.dmg)
          if [[ "${#DMGS[@]}" != "1" || ! -f "${DMGS[0]}" ]]; then
            echo "Expected exactly one macOS DMG before upload." >&2
            exit 1
          fi
          shasum -a 256 -- "${DMGS[0]}" > macos-SHA256SUMS.txt
          shasum -a 256 --check macos-SHA256SUMS.txt
          printf '%s\n' "${{ needs.prepare.outputs.source_sha }}" > macos-SOURCE-SHA.txt
          test "$(cat macos-SOURCE-SHA.txt)" = "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: needs.prepare.outputs.macos_signing != 'true'
        with:
          name: macos-dmg
          path: |
            dist/out/*.dmg
            dist/out/macos-SHA256SUMS.txt
            dist/out/macos-SOURCE-SHA.txt
          if-no-files-found: error
          retention-days: 7
      - name: Stage SHA-bound app for isolated signing
        if: needs.prepare.outputs.macos_signing == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist/signing-input
          COPYFILE_DISABLE=1 tar -C dist -czf dist/signing-input/FolioOrb-app.tar.gz FolioOrb.app
          cd dist/signing-input
          shasum -a 256 FolioOrb-app.tar.gz > macos-app-SHA256SUMS.txt
          shasum -a 256 --check macos-app-SHA256SUMS.txt
          printf '%s\n' "${{ needs.prepare.outputs.source_sha }}" > macos-SOURCE-SHA.txt
          test "$(cat macos-SOURCE-SHA.txt)" = "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: needs.prepare.outputs.macos_signing == 'true'
        with:
          name: macos-app-for-signing
          path: dist/signing-input
          if-no-files-found: error
          retention-days: 1

  sign-macos:
    name: Sign macOS app and DMG (arm64)
    needs: [prepare, build-macos]
    if: needs.prepare.outputs.macos_signing == 'true'
    runs-on: macos-latest
    environment: macos-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-app-for-signing
          path: dist/signing-input
      - name: Verify exact source and app before credential access
        run: |
          set -euo pipefail
          cd dist/signing-input
          test "$(cat macos-SOURCE-SHA.txt)" = "${{ needs.prepare.outputs.source_sha }}"
          test "$(cat macos-SOURCE-SHA.txt)" = "$GITHUB_SHA"
          shasum -a 256 --check macos-app-SHA256SUMS.txt
          python ../../packaging/macos/verify_signing_archive.py FolioOrb-app.tar.gz ..
          test -d ../FolioOrb.app
      - name: Sign and verify Developer ID app bundle
        env:
          MACOS_DEVELOPER_ID_CERTIFICATE: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE }}
          MACOS_DEVELOPER_ID_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_PASSWORD }}
          EXPECTED_TEAM_ID: ${{ vars.MACOS_DEVELOPER_TEAM_ID }}
        run: >-
          packaging/macos/sign_artifact.sh app dist/FolioOrb.app "$EXPECTED_TEAM_ID"
      - name: Smoke test signed frozen bundle
        run: |
          dist/FolioOrb.app/Contents/MacOS/FolioOrb --smoke
          dist/FolioOrb.app/Contents/MacOS/FolioOrb --smoke-duplicate-recovery
      - name: Notarize and staple app bundle
        if: needs.prepare.outputs.macos_notarization == 'true'
        env:
          MACOS_NOTARY_PRIVATE_KEY: ${{ secrets.MACOS_NOTARY_PRIVATE_KEY }}
          FOLIOORB_NOTARY_KEY_ID: ${{ vars.MACOS_NOTARY_KEY_ID }}
          FOLIOORB_NOTARY_ISSUER_ID: ${{ vars.MACOS_NOTARY_ISSUER_ID }}
        run: packaging/macos/with_notary_key.sh app dist/FolioOrb.app
      - name: Install pinned create-dmg
        run: |
          packaging/macos/install_create_dmg.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build DMG
        env:
          ASSET_TOKEN: ${{ needs.prepare.outputs.asset_token }}
        run: >-
          packaging/macos/build_and_verify_dmg.sh
          dist/FolioOrb.app
          "dist/out/FolioOrb-macOS-arm64-${ASSET_TOKEN}.dmg"
      - name: Sign and verify Developer ID DMG
        env:
          ASSET_TOKEN: ${{ needs.prepare.outputs.asset_token }}
          MACOS_DEVELOPER_ID_CERTIFICATE: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE }}
          MACOS_DEVELOPER_ID_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_PASSWORD }}
          EXPECTED_TEAM_ID: ${{ vars.MACOS_DEVELOPER_TEAM_ID }}
        run: |
          set -euo pipefail
          DMG="dist/out/FolioOrb-macOS-arm64-${ASSET_TOKEN}.dmg"
          packaging/macos/sign_artifact.sh dmg "$DMG" "$EXPECTED_TEAM_ID"
          hdiutil verify "$DMG"
          MOUNT_POINT="$(mktemp -d "${RUNNER_TEMP}/folioorb-signed-dmg.XXXXXX")"
          trap 'hdiutil detach "$MOUNT_POINT" -quiet || true; rmdir "$MOUNT_POINT" 2>/dev/null || true' EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT_POINT" "$DMG" >/dev/null
          codesign --verify --deep --strict --verbose=2 "$MOUNT_POINT/FolioOrb.app"
          EMBEDDED_TEAM_ID="$(codesign --display --verbose=4 "$MOUNT_POINT/FolioOrb.app" 2>&1 \
            | sed -n 's/^TeamIdentifier=//p')"
          test "$EMBEDDED_TEAM_ID" = "${{ vars.MACOS_DEVELOPER_TEAM_ID }}"
          hdiutil detach "$MOUNT_POINT" -quiet
          rmdir "$MOUNT_POINT"
          trap - EXIT
      - name: Notarize and staple DMG
        if: needs.prepare.outputs.macos_notarization == 'true'
        env:
          MACOS_NOTARY_PRIVATE_KEY: ${{ secrets.MACOS_NOTARY_PRIVATE_KEY }}
          FOLIOORB_NOTARY_KEY_ID: ${{ vars.MACOS_NOTARY_KEY_ID }}
          FOLIOORB_NOTARY_ISSUER_ID: ${{ vars.MACOS_NOTARY_ISSUER_ID }}
          ASSET_TOKEN: ${{ needs.prepare.outputs.asset_token }}
        run: >-
          packaging/macos/with_notary_key.sh dmg
          "dist/out/FolioOrb-macOS-arm64-${ASSET_TOKEN}.dmg"
      - name: Verify notarized DMG and embedded app
        if: needs.prepare.outputs.macos_notarization == 'true'
        env:
          ASSET_TOKEN: ${{ needs.prepare.outputs.asset_token }}
        run: |
          set -euo pipefail
          DMG="dist/out/FolioOrb-macOS-arm64-${ASSET_TOKEN}.dmg"
          hdiutil verify "$DMG"
          MOUNT_POINT="$(mktemp -d "${RUNNER_TEMP}/folioorb-notary-check.XXXXXX")"
          trap 'hdiutil detach "$MOUNT_POINT" -quiet || true; rmdir "$MOUNT_POINT" 2>/dev/null || true' EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT_POINT" "$DMG" >/dev/null
          xcrun stapler validate "$MOUNT_POINT/FolioOrb.app"
          APP_ASSESSMENT="$(spctl --assess --type execute --verbose=4 "$MOUNT_POINT/FolioOrb.app" 2>&1)"
          printf '%s\n' "$APP_ASSESSMENT"
          grep -F "source=Notarized Developer ID" <<< "$APP_ASSESSMENT"
          hdiutil detach "$MOUNT_POINT" -quiet
          rmdir "$MOUNT_POINT"
          trap - EXIT
      - name: Record macOS artifact checksum
        run: |
          set -euo pipefail
          cd dist/out
          DMGS=(FolioOrb-macOS-arm64-*.dmg)
          if [[ "${#DMGS[@]}" != "1" || ! -f "${DMGS[0]}" ]]; then
            echo "Expected exactly one macOS DMG before upload." >&2
            exit 1
          fi
          shasum -a 256 -- "${DMGS[0]}" > macos-SHA256SUMS.txt
          shasum -a 256 --check macos-SHA256SUMS.txt
          printf '%s\n' "${{ needs.prepare.outputs.source_sha }}" > macos-SOURCE-SHA.txt
          test "$(cat macos-SOURCE-SHA.txt)" = "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-dmg
          path: |
            dist/out/*.dmg
            dist/out/macos-SHA256SUMS.txt
            dist/out/macos-SOURCE-SHA.txt
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows installer (x64)
    needs: [prepare, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
          cache: pip
      - name: Install locked desktop dependencies
        run: python -m pip install --require-hashes -r requirements-desktop-windows.lock
      - name: Exercise Windows backup safety
        run: >-
          python -m pytest -q
          tests/test_backup_policy.py
          tests/test_backup_service.py
          tests/test_source_installer_profile.py
      - name: Exercise Windows source installer and parser gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($script in @(
            "scripts/install-win.ps1",
            "scripts/setup.ps1",
            "scripts/start.ps1",
            "packaging/windows/validate_artifact_signing.ps1",
            "packaging/windows/verify_authenticode.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count) { throw "$script failed PowerShell parsing: $errors" }
          }

          $sandbox = Join-Path $env:RUNNER_TEMP "folioorb-source-installer"
          $env:FOLIOORB_INSTALL_DIR = Join-Path $sandbox "install"
          $env:FOLIOORB_DATA_DIR = Join-Path $sandbox "profile with spaces"
          $env:FOLIOORB_SHORTCUT = Join-Path $sandbox "Desktop\FolioOrb.lnk"
          $env:FOLIOORB_INSTALL_NO_START = "1"
          $env:FOLIO_REF = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "main" }

          New-Item -ItemType Directory -Force -Path "$env:FOLIOORB_INSTALL_DIR\database" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:FOLIOORB_INSTALL_DIR\backups" | Out-Null
          @'
          import os
          import sqlite3
          from pathlib import Path

          install = Path(os.environ["FOLIOORB_INSTALL_DIR"])
          with sqlite3.connect(install / "database" / "portfolio.db") as connection:
              connection.execute("CREATE TABLE proof (value TEXT NOT NULL)")
              connection.execute("INSERT INTO proof VALUES ('preserved')")
              connection.commit()
          '@ | python -
          Set-Content "$env:FOLIOORB_INSTALL_DIR\.env" "DATABASE_URL=sqlite:///./database/portfolio.db"
          Set-Content "$env:FOLIOORB_INSTALL_DIR\settings.json" '{"notify_updates":false}'
          Set-Content "$env:FOLIOORB_INSTALL_DIR\backups\manual.db" "backup-fixture"

          & .\scripts\install-win.ps1
          if ($LASTEXITCODE -ne 0) { throw "First source install failed." }
          if (-not (Test-Path "$env:FOLIOORB_DATA_DIR\settings.json")) { throw "Settings were not migrated." }
          if (-not (Test-Path "$env:FOLIOORB_DATA_DIR\backups\manual.db")) { throw "Backup Vault was not migrated." }
          if (-not (Test-Path $env:FOLIOORB_SHORTCUT)) { throw "Source shortcut was not created." }
          $pointer = (Get-Content "$env:FOLIOORB_INSTALL_DIR\.source-profile-path" -Raw).Trim()
          if ($pointer -ne $env:FOLIOORB_DATA_DIR) { throw "Persisted profile path is not exact and absolute." }
          @'
          import os
          import sqlite3
          from pathlib import Path

          database = Path(os.environ["FOLIOORB_DATA_DIR"]) / "database" / "portfolio.db"
          with sqlite3.connect(database) as connection:
              assert connection.execute("SELECT value FROM proof").fetchone() == ("preserved",)
          '@ | python -

          $parent = Split-Path $env:FOLIOORB_INSTALL_DIR
          $leaf = Split-Path $env:FOLIOORB_INSTALL_DIR -Leaf
          $recoveries = @(Get-ChildItem $parent -Directory -Filter "$leaf-profile-recovery-*")
          if ($recoveries.Count -ne 1) { throw "Expected exactly one first-migration recovery copy." }

          & .\scripts\install-win.ps1
          if ($LASTEXITCODE -ne 0) { throw "Routine source update failed." }
          $after = @(Get-ChildItem $parent -Directory -Filter "$leaf-profile-recovery-*")
          if ($after.Count -ne 1) { throw "Routine update created or removed a recovery copy." }
          @'
          import os
          import sqlite3
          from pathlib import Path

          database = Path(os.environ["FOLIOORB_DATA_DIR"]) / "database" / "portfolio.db"
          with sqlite3.connect(database) as connection:
              assert connection.execute("SELECT value FROM proof").fetchone() == ("preserved",)
          '@ | python -
      - name: Build app bundle
        run: python -m PyInstaller --noconfirm packaging/pyinstaller/FolioOrb.spec
      - name: Smoke test the frozen bundle
        shell: pwsh
        run: |
          # Start-Process alone doesn't pipe the child's stdout/stderr back to
          # this shell, so failures show up as a bare exit code with no
          # message. Redirect to files and print them so a failure is
          # actually diagnosable from the workflow log.
          foreach ($argument in @("--smoke", "--smoke-duplicate-recovery")) {
            $stem = $argument.TrimStart("-")
            $outFile = "$stem-stdout.log"
            $errFile = "$stem-stderr.log"
            $proc = Start-Process -FilePath "dist\FolioOrb\FolioOrb.exe" `
              -ArgumentList $argument -RedirectStandardOutput $outFile `
              -RedirectStandardError $errFile -Wait -PassThru
            Write-Host "--- $argument stdout ---"
            if (Test-Path $outFile) { Get-Content $outFile }
            Write-Host "--- $argument stderr ---"
            if (Test-Path $errFile) { Get-Content $errFile }
            if ($proc.ExitCode -ne 0) {
              Write-Error "$argument failed with exit code $($proc.ExitCode)"
              exit 1
            }
          }
      - name: Build unsigned installer
        if: needs.prepare.outputs.windows_signing != 'true'
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          ASSET_TOKEN: ${{ needs.prepare.outputs.asset_token }}
        run: |
          choco install innosetup -y --no-progress
          $outputName = "FolioOrb-Windows-x64-$env:ASSET_TOKEN-Setup"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$env:APP_VERSION" "/DMyOutputName=$outputName" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Record unsigned Windows artifact checksum
        if: needs.prepare.outputs.windows_signing != 'true'
        shell: pwsh
        env:
          ASSET_TOKEN: ${{ needs.prepare.outputs.asset_token }}
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "dist\installer\FolioOrb-Windows-x64-$env:ASSET_TOKEN-Setup.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "The exact Windows installer is missing before upload."
          }
          $installers = @(Get-ChildItem "dist\installer" -File -Filter "*.exe")
          if ($installers.Count -ne 1 -or $installers[0].FullName -ne (Resolve-Path -LiteralPath $installer).Path) {
            throw "Expected exactly the named Windows installer before upload."
          }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $name = Split-Path -Leaf $installer
          Set-Content -LiteralPath "dist\installer\windows-SHA256SUMS.txt" -Value "$hash  $name" -Encoding ascii
          $recorded = (Get-Content -LiteralPath "dist\installer\windows-SHA256SUMS.txt" -Raw).Trim().Split()[0]
          if ($recorded -ne $hash) { throw "Recorded Windows checksum does not match the installer." }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: needs.prepare.outputs.windows_signing != 'true'
        with:
          name: windows-installer
          path: |
            dist/installer/FolioOrb-Windows-x64-${{ needs.prepare.outputs.asset_token }}-Setup.exe
            dist/installer/windows-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - name: Stage Windows app for isolated signing
        if: needs.prepare.outputs.windows_signing == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-app-for-signing
          path: dist/FolioOrb
          if-no-files-found: error
          retention-days: 1

  sign-windows-app:
    name: Sign Windows app (x64)
    needs: [prepare, build-windows]
    if: needs.prepare.outputs.windows_signing == 'true'
    runs-on: windows-latest
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-app-for-signing
          path: dist/FolioOrb
      - name: Validate Artifact Signing configuration
        shell: pwsh
        env:
          AZURE_ARTIFACT_SIGNING_CLIENT_ID: ${{ vars.AZURE_ARTIFACT_SIGNING_CLIENT_ID }}
          AZURE_ARTIFACT_SIGNING_TENANT_ID: ${{ vars.AZURE_ARTIFACT_SIGNING_TENANT_ID }}
          AZURE_ARTIFACT_SIGNING_SUBSCRIPTION_ID: ${{ vars.AZURE_ARTIFACT_SIGNING_SUBSCRIPTION_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          WINDOWS_SIGNER_SUBJECT: ${{ vars.WINDOWS_SIGNER_SUBJECT }}
        run: packaging\windows\validate_artifact_signing.ps1
      - name: Authenticate to Azure for Artifact Signing
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ vars.AZURE_ARTIFACT_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_ARTIFACT_SIGNING_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_ARTIFACT_SIGNING_SUBSCRIPTION_ID }}
      - name: Sign frozen Windows executable
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}\dist\FolioOrb\FolioOrb.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: FolioOrb
          description-url: https://github.com/udhawan97/FolioOrb
      - name: Verify frozen Windows executable signature
        shell: pwsh
        env:
          EXPECTED_SIGNER_SUBJECT: ${{ vars.WINDOWS_SIGNER_SUBJECT }}
        run: >-
          packaging\windows\verify_authenticode.ps1
          -Path dist\FolioOrb\FolioOrb.exe
          -ExpectedSubject $env:EXPECTED_SIGNER_SUBJECT
      - name: Stage signed Windows app outside the OIDC job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-signed-app
          path: dist/FolioOrb
          if-no-files-found: error
          retention-days: 1

  package-windows-signed:
    name: Package signed Windows app (x64)
    needs: [prepare, sign-windows-app]
    if: needs.prepare.outputs.windows_signing == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-signed-app
          path: dist/FolioOrb
      - name: Smoke test signed frozen bundle
        shell: pwsh
        run: |
          foreach ($argument in @("--smoke", "--smoke-duplicate-recovery")) {
            $stem = "signed-$($argument.TrimStart('-'))"
            $outFile = "$stem-stdout.log"
            $errFile = "$stem-stderr.log"
            $proc = Start-Process -FilePath "dist\FolioOrb\FolioOrb.exe" `
              -ArgumentList $argument -RedirectStandardOutput $outFile `
              -RedirectStandardError $errFile -Wait -PassThru
            if (Test-Path $outFile) { Get-Content $outFile }
            if (Test-Path $errFile) { Get-Content $errFile }
            if ($proc.ExitCode -ne 0) { throw "$argument failed with exit code $($proc.ExitCode)" }
          }
      - name: Build installer around signed executable
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          ASSET_TOKEN: ${{ needs.prepare.outputs.asset_token }}
        run: |
          choco install innosetup -y --no-progress
          $outputName = "FolioOrb-Windows-x64-$env:ASSET_TOKEN-Setup"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$env:APP_VERSION" "/DMyOutputName=$outputName" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Stage Windows installer for isolated signing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-installer-for-signing
          path: dist/installer/FolioOrb-Windows-x64-${{ needs.prepare.outputs.asset_token }}-Setup.exe
          if-no-files-found: error
          retention-days: 1

  sign-windows-installer:
    name: Sign Windows installer (x64)
    needs: [prepare, package-windows-signed]
    if: needs.prepare.outputs.windows_signing == 'true'
    runs-on: windows-latest
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-installer-for-signing
          path: dist/installer
      - name: Validate Artifact Signing configuration
        shell: pwsh
        env:
          AZURE_ARTIFACT_SIGNING_CLIENT_ID: ${{ vars.AZURE_ARTIFACT_SIGNING_CLIENT_ID }}
          AZURE_ARTIFACT_SIGNING_TENANT_ID: ${{ vars.AZURE_ARTIFACT_SIGNING_TENANT_ID }}
          AZURE_ARTIFACT_SIGNING_SUBSCRIPTION_ID: ${{ vars.AZURE_ARTIFACT_SIGNING_SUBSCRIPTION_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          WINDOWS_SIGNER_SUBJECT: ${{ vars.WINDOWS_SIGNER_SUBJECT }}
        run: packaging\windows\validate_artifact_signing.ps1
      - name: Authenticate to Azure for Artifact Signing
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ vars.AZURE_ARTIFACT_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_ARTIFACT_SIGNING_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_ARTIFACT_SIGNING_SUBSCRIPTION_ID }}
      - name: Sign Windows installer
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}\dist\installer\FolioOrb-Windows-x64-${{ needs.prepare.outputs.asset_token }}-Setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: FolioOrb installer
          description-url: https://github.com/udhawan97/FolioOrb
      - name: Verify Windows installer signature
        shell: pwsh
        env:
          ASSET_TOKEN: ${{ needs.prepare.outputs.asset_token }}
          EXPECTED_SIGNER_SUBJECT: ${{ vars.WINDOWS_SIGNER_SUBJECT }}
        run: >-
          packaging\windows\verify_authenticode.ps1
          -Path "dist\installer\FolioOrb-Windows-x64-$env:ASSET_TOKEN-Setup.exe"
          -ExpectedSubject $env:EXPECTED_SIGNER_SUBJECT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-signed-installer
          path: dist/installer/FolioOrb-Windows-x64-${{ needs.prepare.outputs.asset_token }}-Setup.exe
          if-no-files-found: error
          retention-days: 1

  finalize-windows-signed:
    name: Finalize signed Windows installer (x64)
    needs: [prepare, sign-windows-installer]
    if: needs.prepare.outputs.windows_signing == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-signed-installer
          path: dist/installer
      - name: Record signed Windows artifact checksum
        shell: pwsh
        env:
          ASSET_TOKEN: ${{ needs.prepare.outputs.asset_token }}
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "dist\installer\FolioOrb-Windows-x64-$env:ASSET_TOKEN-Setup.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "The exact Windows installer is missing before finalization."
          }
          $installers = @(Get-ChildItem "dist\installer" -File -Filter "*.exe")
          $expected = (Resolve-Path -LiteralPath $installer).Path
          if ($installers.Count -ne 1 -or $installers[0].FullName -ne $expected) {
            throw "Expected exactly the named Windows installer before finalization."
          }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $name = Split-Path -Leaf $installer
          Set-Content -LiteralPath "dist\installer\windows-SHA256SUMS.txt" -Value "$hash  $name" -Encoding ascii
          $recorded = (Get-Content -LiteralPath "dist\installer\windows-SHA256SUMS.txt" -Raw).Trim().Split()[0]
          if ($recorded -ne $hash) { throw "Recorded Windows checksum does not match the installer." }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-installer
          path: |
            dist/installer/FolioOrb-Windows-x64-${{ needs.prepare.outputs.asset_token }}-Setup.exe
            dist/installer/windows-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [prepare, build-macos, sign-macos, build-windows, finalize-windows-signed]
    if: >-
      ${{ always()
      && needs.prepare.outputs.publish == 'true'
      && needs.build-macos.result == 'success'
      && (needs.sign-macos.result == 'success'
      || (needs.prepare.outputs.macos_signing != 'true'
      && needs.sign-macos.result == 'skipped'))
      && needs.build-windows.result == 'success'
      && (needs.finalize-windows-signed.result == 'success'
      || (needs.prepare.outputs.windows_signing != 'true'
      && needs.finalize-windows-signed.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Hoisted to job env because the `secrets` context is NOT allowed in a
      # step `if:` (using it there makes the whole workflow invalid). `env` IS
      # allowed in a step `if:`, so the signing step gates on this instead.
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
      MACOS_SIGNING_ACTIVE: ${{ needs.prepare.outputs.macos_signing }}
      MACOS_SIGNED: ${{ needs.prepare.outputs.macos_signing_public }}
      MACOS_NOTARIZATION_ACTIVE: ${{ needs.prepare.outputs.macos_notarization }}
      MACOS_NOTARIZED: ${{ needs.prepare.outputs.macos_notarization_public }}
      WINDOWS_SIGNING_ACTIVE: ${{ needs.prepare.outputs.windows_signing }}
      WINDOWS_SIGNED: ${{ needs.prepare.outputs.windows_signing_public }}
    steps:
      - name: Download final macOS artifact only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-dmg
          path: artifacts/macos
      - name: Download final Windows artifact only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-installer
          path: artifacts/windows
      - name: Assemble assets and checksums
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' \) -exec cp {} release/ \;
          cd release
          shasum -a 256 -- * > SHA256SUMS.txt
          echo "Assets:"; ls -la

      - name: Sign checksums (minisign)
        # Authenticity signature for SHA256SUMS.txt. Runs only once the signing
        # key secret is configured; until then releases ship SHA-256 checksums
        # only and the app verifies integrity without authenticity. The app
        # embeds the matching public key (app/services/signature_service.py).
        if: ${{ env.MINISIGN_SECRET_KEY != '' }}
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y minisign
          printf '%s\n' "$MINISIGN_SECRET_KEY" > minisign.key
          # Key is created passwordless (minisign -G -W) so CI can sign headless.
          minisign -S -s minisign.key -m release/SHA256SUMS.txt
          rm -f minisign.key
          echo "Signed: $(ls release/SHA256SUMS.txt.minisig)"
      - name: Publish stable release
        if: needs.prepare.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "FolioOrb $TAG" \
              --generate-notes \
              --verify-tag
          fi
      - name: Refresh latest-main prerelease
        if: needs.prepare.outputs.channel == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
          TOKEN: ${{ needs.prepare.outputs.asset_token }}
        run: |
          set -euo pipefail
          BUILT="$(date -u '+%Y-%m-%d %H:%M UTC')"
          if [[ "$MACOS_NOTARIZED" == "true" ]]; then
            MACOS_SECURITY_NOTE="The macOS app and DMG are Developer ID signed and notarized;"
          elif [[ "$MACOS_NOTARIZATION_ACTIVE" == "true" ]]; then
            MACOS_SECURITY_NOTE="macOS signing and notarization are in credentialed pilot validation and are not yet accepted public guarantees;"
          elif [[ "$MACOS_SIGNED" == "true" ]]; then
            MACOS_SECURITY_NOTE="The macOS app and DMG are Developer ID signed but not yet notarized;"
          elif [[ "$MACOS_SIGNING_ACTIVE" == "true" ]]; then
            MACOS_SECURITY_NOTE="macOS signing is in credentialed pilot validation and is not yet an accepted public guarantee;"
          else
            MACOS_SECURITY_NOTE="macOS remains unsigned and not notarized;"
          fi
          if [[ "$WINDOWS_SIGNED" == "true" ]]; then
            WINDOWS_SECURITY_NOTE="the Windows executable and installer are Authenticode signed. SmartScreen reputation warnings can still appear."
          elif [[ "$WINDOWS_SIGNING_ACTIVE" == "true" ]]; then
            WINDOWS_SECURITY_NOTE="Windows signing is in credentialed pilot validation and is not yet an accepted public guarantee."
          else
            WINDOWS_SECURITY_NOTE="Windows remains unsigned."
          fi
          if [[ "$MACOS_SIGNING_ACTIVE" != "true" && "$WINDOWS_SIGNING_ACTIVE" != "true" ]]; then
            SECURITY_NOTE="Builds are not yet code-signed."
          else
            SECURITY_NOTE="${MACOS_SECURITY_NOTE} ${WINDOWS_SECURITY_NOTE}"
          fi
          NOTES=$(cat <<EOF
          **Rolling development build from \`main\`.**

          - Commit: \`${GITHUB_SHA}\`
          - Build: \`${TOKEN}\`
          - Built: ${BUILT}

          > ⚠️ These builds come straight from the latest \`main\` merge and may be
          > unstable. For everyday use, grab the [latest stable release](https://github.com/${GITHUB_REPOSITORY}/releases/latest).
          >
          > ${SECURITY_NOTE} See the install docs for the expected platform warnings
          > and how to verify your download with SHA256SUMS.txt.
          EOF
          )
          (cd release && shasum -a 256 --check SHA256SUMS.txt)

          # Refresh in place so a failed update cannot delete the last good
          # development build. Asset names include the commit, so upload the
          # new set first, move the rolling tag, then prune stale assets.
          if gh release view latest-main --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest-main release/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest-main" \
              --raw-field sha="$GITHUB_SHA" \
              -F force=true \
              --silent
            gh release edit latest-main \
              --repo "$GITHUB_REPOSITORY" \
              --title "Latest main build" \
              --notes "$NOTES" \
              --prerelease \
              --target "$GITHUB_SHA"

            while IFS=$'\t' read -r asset_api asset_name; do
              if [[ ! -f "release/${asset_name}" ]]; then
                gh api --method DELETE \
                  "${asset_api#https://api.github.com/}" \
                  --silent
              fi
            done < <(
              gh release view latest-main \
                --repo "$GITHUB_REPOSITORY" \
                --json assets \
                --jq '.assets[] | [.apiUrl, .name] | @tsv'
            )
          else
            gh release create latest-main release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Latest main build" \
              --notes "$NOTES" \
              --prerelease \
              --target "$GITHUB_SHA"
          fi

          # Verify the remote release before declaring the rolling channel
          # refreshed. This catches tag drift and stale/missing assets.
          ACTUAL_SHA="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/latest-main" \
              --jq '.object.sha'
          )"
          if [[ "$ACTUAL_SHA" != "$GITHUB_SHA" ]]; then
            echo "latest-main points to ${ACTUAL_SHA}, expected ${GITHUB_SHA}" >&2
            exit 1
          fi

          diff -u \
            <(find release -maxdepth 1 -type f -printf '%f\n' | sort) \
            <(
              gh release view latest-main \
                --repo "$GITHUB_REPOSITORY" \
                --json assets \
                --jq '.assets[].name' | sort
            )
