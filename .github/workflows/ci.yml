name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Prepare isolated FolioOrb profile
        run: |
          PROFILE_ROOT="$(mktemp -d "${RUNNER_TEMP}/folioorb-ci-${{ matrix.python-version }}.XXXXXX")"
          echo "FOLIOORB_DATA_DIR=$PROFILE_ROOT" >> "$GITHUB_ENV"
          echo "DATABASE_URL=sqlite:///$PROFILE_ROOT/database/portfolio.db" >> "$GITHUB_ENV"

      - name: Compile Python sources
        run: python -m compileall -q app run.py tests

      - name: Import FastAPI app
        env:
          ANTHROPIC_API_KEY: ""
        run: python -c "from app.main import app; print(app.title)"

      - name: Run tests
        env:
          ANTHROPIC_API_KEY: ""
        run: python -m pytest -q

      - name: Run frontend runtime contracts
        run: node --test tests/js/*.test.cjs

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Audit pinned Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          pip-audit -r requirements.txt
          pip-audit --no-deps --disable-pip -r requirements-desktop-macos.lock
          pip-audit --no-deps --disable-pip -r requirements-release-test-linux.lock
          pip-audit --no-deps --disable-pip -r requirements-desktop-windows.lock

      - name: Verify generated desktop locks are current
        run: |
          python -m pip install uv==0.11.30
          LOCK_CHECK="$(mktemp -d "${RUNNER_TEMP}/folioorb-lock-check.XXXXXX")"
          scripts/lock_desktop_dependencies.sh "$LOCK_CHECK"
          diff -u requirements-desktop-macos.lock "$LOCK_CHECK/requirements-desktop-macos.lock"
          diff -u requirements-release-test-linux.lock "$LOCK_CHECK/requirements-release-test-linux.lock"
          diff -u requirements-desktop-windows.lock "$LOCK_CHECK/requirements-desktop-windows.lock"
